<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>BusLiner &bull; Выбор места в салоне (Production Demo)</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- React 18 & Babel Standalone for direct live browser execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* ==========================================================================
       BUSLINER 2D SEAT PICKER // QUIET LUXURY TOKENS
       ========================================================================== */
    :root {
      --sp-canvas: #F5F1EA;
      --sp-surface: #FBF9F5;
      --sp-surface-subtle: #E8E2D6;
      --sp-border: rgba(184, 169, 154, 0.42);
      --sp-border-strong: rgba(184, 169, 154, 0.65);
      --sp-text-main: #1C1D1C;
      --sp-text-muted: #5C5852;
      --sp-text-subtle: #8A847C;
      --sp-brand-primary: #7A2320; /* Hermès Oxblood */
      --sp-brand-primary-hover: #611A18;
      --sp-brand-light: #F9EBEA;
      --sp-brand-border: #D98880;

      --sp-seat-available-bg: #FFFFFF;
      --sp-seat-available-border: #D9CDB8;
      --sp-seat-available-hover: #F5F1EA;
      --sp-seat-selected-bg: #7A2320;
      --sp-seat-selected-border: #7A2320;
      --sp-seat-selected-text: #F5F1EA;
      --sp-seat-occupied-bg: #E8E2D6;
      --sp-seat-occupied-border: #D9CDB8;
      --sp-seat-occupied-text: #8A847C;
      --sp-seat-female-bg: #FBF4F1;
      --sp-seat-female-border: #E8CFC6;
      --sp-seat-male-bg: #EAEFEA;
      --sp-seat-male-border: #A3C9A8;
      --sp-seat-disabled-bg: #EAEFEA;
      --sp-seat-disabled-border: #2E4F3E;

      --font-display: 'Cormorant Garamond', Garamond, Georgia, serif;
      --font-body: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', SFMono-Regular, monospace;

      --sp-radius-card: 14px;
      --sp-radius-seat: 6px;
      --sp-shadow-card: 0 4px 20px rgba(0, 0, 0, 0.04);
      --sp-shadow-tooltip: 0 8px 24px rgba(28, 29, 28, 0.16);
      --sp-shadow-sticky: 0 -4px 20px rgba(0, 0, 0, 0.04);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--sp-canvas);
      color: var(--sp-text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 40px 16px 80px;
      line-height: 1.5;
    }

    .demo-container {
      max-width: 820px;
      margin: 0 auto;
    }

    .demo-top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 18px;
      color: #0F172A;
      text-decoration: none;
    }

    .brand-squircle {
      width: 32px;
      height: 32px;
      background: #1E3A8A;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
    }

    /* SeatPicker Styles */
    .seatPickerCard {
      background: var(--sp-surface);
      border: 1px solid var(--sp-border);
      border-radius: var(--sp-radius-card);
      box-shadow: var(--sp-shadow-card);
      padding: 24px;
    }

    .pickerHeader {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 16px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--sp-border);
    }

    .carrierTagline {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .carrierTagBadge {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: var(--sp-surface-subtle);
      color: var(--sp-text-muted);
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid var(--sp-border);
    }

    .carrierName {
      font-size: 12px;
      font-weight: 600;
      color: var(--sp-brand-primary);
    }

    .pickerTitle {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 4px 0;
      letter-spacing: -0.01em;
    }

    .pickerSubtitle {
      font-size: 13px;
      color: var(--sp-text-muted);
    }

    .vehicleSwitcher {
      display: flex;
      background: var(--sp-surface-subtle);
      padding: 3px;
      border-radius: 8px;
      border: 1px solid var(--sp-border);
      gap: 4px;
    }

    .switchBtn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--sp-text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .switchBtn:hover { color: var(--sp-text-main); }
    .switchBtn_active {
      background: var(--sp-surface);
      color: var(--sp-brand-primary);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
    }

    /* Legend */
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 18px;
      padding: 16px 0;
      border-bottom: 1px solid var(--sp-border);
      font-size: 12px;
      color: var(--sp-text-muted);
    }

    .legendItem {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .legendChip {
      width: 14px;
      height: 14px;
      border-radius: 3px;
    }

    .legendChip_available { background: var(--sp-seat-available-bg); border: 1.5px solid var(--sp-seat-available-border); }
    .legendChip_selected { background: var(--sp-seat-selected-bg); border: 1.5px solid var(--sp-seat-selected-border); }
    .legendChip_occupied { background: var(--sp-seat-occupied-bg); border: 1.5px solid var(--sp-seat-occupied-border); }
    .legendChip_blocked {
      background: repeating-linear-gradient(-45deg, #E2E8F0, #E2E8F0 2px, #FFFFFF 2px, #FFFFFF 4px);
      border: 1.5px solid var(--sp-border-strong);
    }
    .legendChip_female { background: var(--sp-seat-female-bg); border: 1.5px solid var(--sp-seat-female-border); }
    .legendChip_male { background: var(--sp-seat-male-bg); border: 1.5px solid var(--sp-seat-male-border); }
    .legendChip_disabled { background: var(--sp-seat-disabled-bg); border: 1.5px solid var(--sp-seat-disabled-border); }

    /* Map */
    .seatMapWrapper {
      position: relative;
      padding: 24px 0 16px;
    }

    .seatMapScrollArea {
      overflow-x: auto;
      padding: 8px 4px 16px;
      -webkit-overflow-scrolling: touch;
    }

    .busHull {
      background: #FFFFFF;
      border: 2px solid #CBD5E1;
      border-radius: 28px;
      min-width: 380px;
      max-width: 440px;
      margin: 0 auto;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
    }

    .busFrontHeader {
      background: #F8FAFC;
      border-bottom: 2px solid #E2E8F0;
      border-radius: 26px 26px 0 0;
      padding: 16px 18px 12px;
    }

    .busWindshield {
      position: relative;
      height: 28px;
      background: linear-gradient(180deg, rgba(30, 58, 138, 0.08) 0%, rgba(30, 58, 138, 0.02) 100%);
      border: 1.5px solid #CBD5E1;
      border-radius: 14px 14px 6px 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .busFrontLabel {
      font-size: 10px;
      font-weight: 700;
      color: #64748B;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .windshieldWiperLeft, .windshieldWiperRight {
      position: absolute;
      bottom: 2px;
      width: 28px;
      height: 2px;
      background: #94A3B8;
    }
    .windshieldWiperLeft { left: 30px; transform: rotate(15deg); }
    .windshieldWiperRight { right: 40px; transform: rotate(-15deg); }

    .frontCockpitRow {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .driverCockpit {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .steeringWheel {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #FFFFFF;
      border: 1.5px solid #64748B;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #334155;
    }

    .driverLabel {
      font-size: 11px;
      font-weight: 700;
      color: #475569;
      text-transform: uppercase;
    }

    .entranceDoor {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: #FEF3C7;
      border: 1px dashed #D97706;
      border-radius: 6px;
    }

    .entranceStairs { display: flex; flex-direction: column; gap: 2px; }
    .stairStep { width: 14px; height: 3px; background: #D97706; border-radius: 1px; }
    .entranceMeta { font-size: 10.5px; font-weight: 800; color: #92400E; text-transform: uppercase; display: flex; align-items: center; gap: 4px; }

    .cabinSaloon { padding: 16px 14px; }
    .cabinRow { display: flex; align-items: center; margin-bottom: 8px; }
    .rowNumberIndicator { width: 16px; font-size: 11px; font-weight: 700; color: var(--sp-text-subtle); text-align: right; margin-right: 8px; }
    .rowSeatsGroup { flex: 1; display: flex; align-items: center; justify-content: space-between; }
    .sidePair { display: flex; gap: 6px; align-items: center; }
    .aisleTrack { flex: 1; display: flex; justify-content: center; align-items: center; min-width: 32px; }
    .aisleDottedLine { width: 1.5px; height: 28px; border-left: 1.5px dashed #CBD5E1; }

    .serviceZoneWc {
      width: 88px;
      height: 42px;
      background: #F1F5F9;
      border: 1px solid #CBD5E1;
      border-radius: var(--sp-radius-seat);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 800;
      color: #475569;
    }

    /* Seat Element */
    .seat {
      width: 44px;
      height: 42px;
      position: relative;
      padding: 0;
      background: var(--sp-seat-available-bg);
      border: 1.5px solid var(--sp-seat-available-border);
      border-radius: var(--sp-radius-seat);
      cursor: pointer;
      outline: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.16s cubic-bezier(0.16, 1, 0.3, 1),
                  box-shadow 0.16s ease,
                  border-color 0.16s ease,
                  background-color 0.16s ease;
      font-family: inherit;
    }

    .seat:focus-visible {
      outline: 2px solid var(--sp-brand-primary);
      outline-offset: 2px;
      z-index: 2;
    }

    .seatBackrest {
      height: 12px;
      background: rgba(0, 0, 0, 0.03);
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 5px 5px 0 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .seatHeadrest {
      width: 20px;
      height: 5px;
      border-radius: 2px;
      background: rgba(0, 0, 0, 0.08);
    }

    .seatCushion {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .seatNumber {
      font-size: 12px;
      font-weight: 700;
      color: var(--sp-text-main);
      line-height: 1;
    }

    .seatArmrestLeft, .seatArmrestRight {
      position: absolute;
      top: 10px;
      width: 3px;
      height: 18px;
      background: rgba(0, 0, 0, 0.08);
      border-radius: 1.5px;
    }
    .seatArmrestLeft { left: 1.5px; }
    .seatArmrestRight { right: 1.5px; }

    .seatIconBadge { position: absolute; top: 2px; right: 2px; display: flex; color: inherit; }
    .seatFeeDotPlus { position: absolute; bottom: 2px; right: 3px; width: 5px; height: 5px; border-radius: 50%; background: #10B981; }
    .seatFeeDotMinus { position: absolute; bottom: 2px; right: 3px; width: 5px; height: 5px; border-radius: 50%; background: #F59E0B; }

    /* States */
    .seat_available:hover {
      background: var(--sp-seat-available-hover);
      border-color: #94A3B8;
      transform: translateY(-1.5px);
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.08);
    }

    .seat_selected {
      background: var(--sp-seat-selected-bg) !important;
      border-color: var(--sp-seat-selected-border) !important;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(30, 58, 138, 0.3) !important;
    }
    .seat_selected .seatNumber { color: #FFFFFF !important; }
    .seat_selected .seatBackrest { background: rgba(255, 255, 255, 0.15); border-bottom-color: rgba(255, 255, 255, 0.2); }
    .seat_selected .seatHeadrest { background: rgba(255, 255, 255, 0.3); }

    .seat_occupied {
      background: var(--sp-seat-occupied-bg);
      border-color: var(--sp-seat-occupied-border);
      cursor: not-allowed;
    }
    .seat_occupied .seatNumber { color: var(--sp-seat-occupied-text); text-decoration: line-through; }

    .seat_blocked {
      background: repeating-linear-gradient(-45deg, #F1F5F9, #F1F5F9 3px, #FFFFFF 3px, #FFFFFF 6px);
      border-color: #CBD5E1;
      cursor: not-allowed;
    }
    .seat_blocked .seatNumber { color: #94A3B8; }

    .seat_female-only { background: var(--sp-seat-female-bg); border-color: var(--sp-seat-female-border); color: #DB2777; }
    .seat_female-only:hover { background: #FCE7F3; }
    .seat_male-only { background: var(--sp-seat-male-bg); border-color: var(--sp-seat-male-border); color: #0284C7; }
    .seat_male-only:hover { background: #E0F2FE; }
    .seat_disabled { background: var(--sp-seat-disabled-bg); border-color: var(--sp-seat-disabled-border); color: #2563EB; }
    .seat_disabled:hover { background: #DBEAFE; }

    /* Rear Luggage */
    .busRearLuggage {
      background: #F8FAFC;
      border-top: 2px solid #E2E8F0;
      border-radius: 0 0 26px 26px;
      padding: 14px 18px;
    }
    .luggageCompartment {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #FFFFFF;
      border: 1px dashed #CBD5E1;
      border-radius: 8px;
      padding: 8px 12px;
    }
    .luggageTitle { font-size: 11px; font-weight: 700; }
    .luggageSub { font-size: 10px; color: #64748B; }
    .busRearBumper { height: 5px; width: 120px; background: #CBD5E1; border-radius: 3px; margin: 10px auto 0; }

    /* Tooltip */
    .tooltip {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 50;
      width: 230px;
      background: #0F172A;
      color: #FFFFFF;
      border-radius: 10px;
      padding: 12px 14px;
      box-shadow: var(--sp-shadow-tooltip);
      pointer-events: none;
      transition: opacity 0.15s ease, transform 0.15s ease;
      font-size: 12px;
    }
    .tooltipHeader { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
    .tooltipTitle { display: flex; flex-direction: column; gap: 2px; }
    .tooltipSeatNum { font-size: 13px; font-weight: 800; }
    .tooltipTypeBadge { font-size: 10px; color: #94A3B8; }
    .tooltipPrice { font-size: 14px; font-weight: 800; color: #38BDF8; }
    .tooltipExtraFee { display: block; font-size: 9px; font-weight: 600; color: #34D399; text-align: right; }
    .tooltipDiscountFee { display: block; font-size: 9px; font-weight: 600; color: #FBBF24; text-align: right; }
    .tooltipStatusNotice { background: rgba(255, 255, 255, 0.1); border-radius: 4px; padding: 4px 6px; font-size: 10.5px; margin-bottom: 8px; color: #F8FAFC; }
    .tooltipFeatures { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
    .tooltipFeatureItem { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #CBD5E1; }
    .tooltipFeatureItem svg { color: #38BDF8; flex-shrink: 0; }

    /* Sticky Bar */
    .summaryStickyBar {
      position: sticky;
      bottom: 0;
      background: #FFFFFF;
      border-top: 1px solid var(--sp-border);
      box-shadow: var(--sp-shadow-sticky);
      border-radius: 0 0 var(--sp-radius-card) var(--sp-radius-card);
      margin: 16px -24px -24px -24px;
      padding: 16px 24px;
      z-index: 20;
    }

    .limitBanner {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #FEF2F2;
      border: 1px solid #FECACA;
      color: #991B1B;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      animation: slideDown 0.2s ease;
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .summaryContainer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }
    .summaryDetails { flex: 1; min-width: 240px; }
    .summaryEmptyState { display: flex; align-items: center; gap: 10px; }
    .summaryEmptyIcon {
      width: 32px; height: 32px; border-radius: 8px; background: var(--sp-surface-subtle);
      border: 1px solid var(--sp-border); display: flex; align-items: center; justify-content: center; color: var(--sp-text-muted);
    }
    .summaryEmptyTitle { font-size: 13px; font-weight: 700; color: var(--sp-text-main); }
    .summaryEmptySubtitle { font-size: 11.5px; color: var(--sp-text-muted); margin-top: 2px; }
    .summaryHeader { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
    .summaryCount { font-size: 12px; font-weight: 600; color: var(--sp-text-muted); }
    .summaryTotalPrice { font-size: 18px; font-weight: 800; color: var(--sp-brand-primary); }
    .summaryChipsList { display: flex; flex-wrap: wrap; gap: 6px; }
    .summaryChip {
      display: inline-flex; align-items: center; gap: 6px; background: var(--sp-brand-light);
      border: 1px solid var(--sp-brand-border); color: var(--sp-brand-primary);
      font-size: 11.5px; font-weight: 700; padding: 3px 8px; border-radius: 6px;
    }
    .summaryChipRemoveBtn { background: transparent; border: none; padding: 0; display: flex; color: var(--sp-brand-primary); cursor: pointer; opacity: 0.6; }
    .summaryChipRemoveBtn:hover { opacity: 1; }
    .summaryProceedBtn {
      display: inline-flex; align-items: center; gap: 8px; background: var(--sp-brand-primary);
      color: #FFFFFF; border: none; border-radius: 10px; padding: 12px 22px; font-size: 14px;
      font-weight: 700; cursor: pointer; font-family: inherit; transition: all 0.15s ease;
    }
    .summaryProceedBtn:hover:not(:disabled) {
      background: var(--sp-brand-primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(30, 58, 138, 0.25);
    }
    .summaryProceedBtn:disabled { background: #E2E8F0; color: #94A3B8; cursor: not-allowed; }

    @media (max-width: 640px) {
      body {
        padding: 10px 10px calc(80px + env(safe-area-inset-bottom));
      }
      .demo-container {
        padding: 0;
      }
      .seatPickerCard {
        border-radius: 12px;
        padding: 16px 12px;
      }
      .summaryStickyBar {
        margin: 16px -12px -12px -12px;
        padding: 14px 16px;
        flex-direction: column;
        align-items: stretch;
      }
      .summaryProceedBtn {
        width: 100%;
        justify-content: center;
        min-height: 48px;
      }
      .summaryAction {
        width: 100%;
      }
      .pickerHeader {
        flex-direction: column;
        gap: 12px;
      }
    }
  
    /* Artisanal Paper Grain Overlay */
    .paper-grain-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.034;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 250 250' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

  </style>
</head>
<body>
  <div class="paper-grain-overlay"></div>

  <div class="demo-container">
    <nav class="demo-top-nav">
      <a href="index.html" class="brand-logo">
        <span class="brand-squircle">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </span>
        <span>BusLiner Booking</span>
      </a>
      <div style="font-size: 12px; color: #64748B; font-weight: 600;">
        Рейс #BY-204 &bull; Минск &rarr; Гродно
      </div>
    </nav>

    <!-- React Root Mount -->
    <div id="seat-picker-root"></div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- Mock Data ---
    const minibus19Mock = {

    // --- Tooltip Component ---
    function Tooltip({ seat, targetRect, containerRect, visible }) {
      const (coords, setCoords) = useState({ top: 0, left: 0, placement: 'top' });
      const ref = useRef(null);

      useEffect(() => {
        if (!visible || !targetRect || !containerRect || !ref.current) return;
        const width = 230;
        const height = ref.current.offsetHeight || 110;
        const targetCenterX = targetRect.left - containerRect.left + targetRect.width / 2;
        let left = targetCenterX - width / 2;
        if (left < 8) left = 8;
        if (left + width > containerRect.width - 8) left = containerRect.width - width - 8;

        const spaceTop = targetRect.top - containerRect.top;
        let top = 0;
        let placement = 'top';
        if (spaceTop >= height + 12) {
          top = targetRect.top - containerRect.top - height - 10;
          placement = 'top';
        } else {
          top = targetRect.bottom - containerRect.top + 10;
          placement = 'bottom';
        }
        setCoords({ top, left, placement });
      }, (visible, targetRect, containerRect, seat));

      if (!seat || !visible) return null;

      const typeLabels = {
        panoramic: 'Панорамный обзор',
        'extra-legroom': 'Больше места для ног',
        table: 'Место со столиком',
        'limited-recline': 'Ограниченный наклон',
        window: 'У окна',
        aisle: 'У прохода',
        standard: 'Стандартное место'
      };

      const notices = {
        'female-only': 'Только для женщин',
        'male-only': 'Только для мужчин',
        disabled: 'Приоритет для маломобильных граждан',
        blocked: 'Заблокировано перевозчиком',
        occupied: 'Место уже занято'
      };

      return (
        <div
          ref={ref}
          className="tooltip"
          style={{
            transform: `translate3d(${Math.round(coords.left)}px, ${Math.round(coords.top)}px, 0)`,
            opacity: visible ? 1 : 0
          }}
          role="tooltip"
          aria-hidden="true"
        >
          <div className="tooltipHeader">
            <div className="tooltipTitle">
              <span className="tooltipSeatNum">Место {seat.seatNumber}</span>
              <span className="tooltipTypeBadge">{typeLabels(seat.type) || 'Стандарт'}</span>
            </div>
            <div className="tooltipPrice">
              {seat.price} ₽
              {seat.extraFee > 0 && <span className="tooltipExtraFee">+{seat.extraFee} ₽</span>}
              {seat.extraFee < 0 && <span className="tooltipDiscountFee">{seat.extraFee} ₽</span>}
            </div>
          </div>
          {notices(seat.status) && (
            <div className="tooltipStatusNotice">{notices(seat.status)}</div>
          )}
          {seat.features && seat.features.length > 0 && (
            <ul className="tooltipFeatures">
              {seat.features.map((f, i) => (
                <li key={i} className="tooltipFeatureItem">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                  <span>{f}</span>
                </li>
              ))}
            </ul>
          )}
        </div>
      );
    }

    // --- Seat Component ---
    function Seat({ seat, isSelected, onSelect, onHoverStart, onHoverEnd }) {
      const ref = useRef(null);
      const timerRef = useRef(null);
      const isInteractive = seat.status !== 'occupied' && seat.status !== 'blocked';

      const handleMouseEnter = () => {
        if (timerRef.current) clearTimeout(timerRef.current);
        timerRef.current = setTimeout(() => {
          if (ref.current) onHoverStart(seat, ref.current.getBoundingClientRect());
        }, 320);
      };

      const handleMouseLeave = () => {
        if (timerRef.current) { clearTimeout(timerRef.current); timerRef.current = null; }
        onHoverEnd();
      };

      const handleFocus = () => {
        if (ref.current) onHoverStart(seat, ref.current.getBoundingClientRect());
      };

      const statusClass = isSelected ? 'seat_selected' : `seat_${seat.status}`;

      return (
        <button
          ref={ref}
          type="button"
          className={`seat ${statusClass}`}
          disabled={!isInteractive}
          onClick={() => isInteractive && onSelect(seat)}
          onMouseEnter={handleMouseEnter}
          onMouseLeave={handleMouseLeave}
          onFocus={handleFocus}
          onBlur={onHoverEnd}
          aria-label={seat.accessibleLabel}
          aria-pressed={isSelected}
        >
          <span className="seatBackrest"><span className="seatHeadrest" /></span>
          <span className="seatCushion">
            <span className="seatNumber">{seat.seatNumber}</span>
            {seat.status === 'disabled' && (
              <span className="seatIconBadge">
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><circle cx="12" cy="4" r="2"/><path d="M19 13v-2a4 4 0 0 0-4-4h-3a4 4 0 0 0-4 4v7"/><circle cx="9" cy="18" r="3"/></svg>

    // --- Master SeatPicker Component ---
    function SeatPicker() {
      const (layout, setLayout) = useState(minibus19Mock);
      const (selectedSeats, setSelectedSeats) = useState([]);
      const (limitNotice, setLimitNotice) = useState(null);
      const maxSeats = 2;

      const containerRef = useRef(null);
      const (containerRect, setContainerRect) = useState(null);
      const (tooltip, setTooltip) = useState({ seat: null, rect: null, visible: false });

      const updateRect = () => {
        if (containerRef.current) setContainerRect(containerRef.current.getBoundingClientRect());
      };

      useEffect(() => {
        updateRect();
        window.addEventListener('resize', updateRect);
        return () => window.removeEventListener('resize', updateRect);
      }, []);

      const handleSwitch = (type) => {
        setSelectedSeats([]);
        setLimitNotice(null);
        setTooltip(prev => ({ ...prev, visible: false }));
        setLayout(type === 'minibus' ? minibus19Mock : coach49Mock);
      };

      const handleSeatToggle = (seat) => {
        setLimitNotice(null);
        const exists = selectedSeats.some(s => s.id === seat.id);
        if (exists) {
          setSelectedSeats(selectedSeats.filter(s => s.id !== seat.id));
        } else {
          if (selectedSeats.length >= maxSeats) {
            setLimitNotice(`Выбрано максимальное количество мест (${maxSeats}). Снимите выбор с одного из мест, чтобы выбрать другое.`);
            return;
          }
          setSelectedSeats((...selectedSeats, seat));
        }
      };

      const rowsMap = new Map();
      for (let r = 1; r <= layout.rowsCount; r++) rowsMap.set(r, []);
      layout.seats.forEach(s => {
        const arr = rowsMap.get(s.row) || [];
        arr.push(s);
        rowsMap.set(s.row, arr);
      });

      return (
        <div className="seatPickerCard">
          <header className="pickerHeader">
            <div>
              <div className="carrierTagline">
                <span className="carrierTagBadge">Шаг 2 из 3 &bull; Рассадка</span>
                <span className="carrierName">{layout.carrierName}</span>
              </div>
              <h2 className="pickerTitle">Выбор места в салоне</h2>
              <p className="pickerSubtitle">
                {layout.name} &bull; {layout.totalSeats} мест &bull; {layout.type === 'minibus_2_1' ? 'Компоновка 2+1' : 'Компоновка 2+2'}
              </p>
            </div>

            <div className="vehicleSwitcher">
              <button
                type="button"
                className={`switchBtn ${layout.type === 'minibus_2_1' ? 'switchBtn_active' : ''}`}
                onClick={() => handleSwitch('minibus')}
              >
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M7 15h.01M17 15h.01"/></svg>
                <span>Микроавтобус (19 мест, 2+1)</span>
              </button>
              <button
                type="button"
                className={`switchBtn ${layout.type === 'coach_2_2' ? 'switchBtn_active' : ''}`}
                onClick={() => handleSwitch('coach')}
              >
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="M2 10h20M6 16h.01M18 16h.01"/></svg>
                <span>Лайнер (49 мест, 2+2)</span>
              </button>
            </div>
          </header>

          <Legend />

          <div ref={containerRef} className="seatMapWrapper">
            <Tooltip
              seat={tooltip.seat}
              targetRect={tooltip.rect}
              containerRect={containerRect}
              visible={tooltip.visible}
            />

            <div className="seatMapScrollArea">
              <div className="busHull">
                <header className="busFrontHeader">
                  <div className="busWindshield">
                    <span className="windshieldWiperLeft" />
                    <span className="windshieldWiperRight" />
                    <span className="busFrontLabel">{layout.carrierName} &bull; Направление движения &rarr;</span>
                  </div>
                  <div className="frontCockpitRow">
                    <div className="driverCockpit">
                      <div className="steeringWheel">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/><line x1="2" y1="12" x2="9" y2="12"/><line x1="15" y1="12" x2="22" y2="12"/><line x1="12" y1="15" x2="12" y2="22"/></svg>
                      </div>
                      <span className="driverLabel">Водитель</span>
                    </div>
                    <div className="entranceDoor">
                      <div className="entranceStairs"><span className="stairStep"/><span className="stairStep"/></div>
                      <div className="entranceMeta"><span>Вход</span></div>
                    </div>
                  </div>
                </header>

                <main className="cabinSaloon">
                  {Array.from(rowsMap.entries()).map(((rowNum, seatsInRow)) => {
                    const wc = layout.serviceZones.find(z => z.row === rowNum && z.type === 'wc');
                    const isMidEntrance = layout.entrances.find(e => e.row === rowNum && e.row !== 1);

                    return (
                      <div key={rowNum} className="cabinRow">
                        <span className="rowNumberIndicator">{rowNum}</span>
                        <div className="rowSeatsGroup">
                          <div className="sidePair">
                            {seatsInRow.filter(s => s.col < layout.aisleColumnIndex).map(seat => (
                              <Seat
                                key={seat.id}
                                seat={seat}
                                isSelected={selectedSeats.some(x => x.id === seat.id)}
                                onSelect={handleSeatToggle}
                                onHoverStart={(s, r) => { updateRect(); setTooltip({ seat: s, rect: r, visible: true }); }}
                                onHoverEnd={() => setTooltip(prev => ({ ...prev, visible: false }))}
                              />
                            ))}
                          </div>

                          <div className="aisleTrack"><span className="aisleDottedLine" /></div>

                          <div className="sidePair">
                            {wc ? (
                              <div className="serviceZoneWc">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="12" cy="9" r="2.5"/><path d="M9 18v-3a3 3 0 0 1 6 0v3"/></svg>
                                <span>WC</span>
                              </div>
                            ) : (
                              seatsInRow.filter(s => s.col >= layout.aisleColumnIndex).map(seat => (
                                <Seat
                                  key={seat.id}
                                  seat={seat}
                                  isSelected={selectedSeats.some(x => x.id === seat.id)}
                                  onSelect={handleSeatToggle}
                                  onHoverStart={(s, r) => { updateRect(); setTooltip({ seat: s, rect: r, visible: true }); }}
                                  onHoverEnd={() => setTooltip(prev => ({ ...prev, visible: false }))}
                                />
                              ))
                            )}
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </main>

                <footer className="busRearLuggage">
                  <div className="luggageCompartment">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#64748B" strokeWidth="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
                    <div>
                      <div className="luggageTitle">Багажный отсек</div>
                      <div className="luggageSub">До 2 мест багажа в багажном отделении</div>
                    </div>
                  </div>
                  <div className="busRearBumper" />
                </footer>
              </div>
            </div>
          </div>

          <SelectionSummary
            selectedSeats={selectedSeats}
            maxSeats={maxSeats}
            onRemoveSeat={(id) => setSelectedSeats(selectedSeats.filter(s => s.id !== id))}
            limitNotice={limitNotice}
          />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('seat-picker-root')).render(<SeatPicker />);
  </script>
</body>
</html>
